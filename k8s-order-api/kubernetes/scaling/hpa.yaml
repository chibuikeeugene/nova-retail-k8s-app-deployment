apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: nova-retail
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-api
  minReplicas: 2
  maxReplicas: 6
  metrics: # ensure metrics server is installed. Use helm to install metrics server in your designated namespace
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
