apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-ingress
  namespace: nova-retail
  labels:
    app.kubernetes.io/name: order-api
spec:
  # ingressClassName: nginx
  rules:
  - host: order.localhost
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: order-service
            port: 
              number: 80
