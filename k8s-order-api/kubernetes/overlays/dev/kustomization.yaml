apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nova-dev
resources:
  - ../../base
  - storage.yaml

replicas:
  - name: order-api
    count: 1

images:
  - name: order-api
    newTag: v2.0.1

configMapGenerator:
  - name: order-api-config
    behavior: replace
    literals:
      - APP_ENV=dev
      - APP_VERSION=2.0.1