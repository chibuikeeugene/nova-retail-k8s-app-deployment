apiVersion: v1
kind: PersistentVolume
metadata:
  name: order-data-dev-pv
spec:
  capacity:
    storage: "1Gi"
  volumeMode: Filesystem
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: nova-dev
    name: order-shared-pvc
  hostPath:
    path: /mnt/shared/dev
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-shared-pvc
  # namespace: nova-retail
spec:
  resources:
    requests:
      storage: "500Mi"
  volumeMode: Filesystem
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  volumeName: order-data-dev-pv
 