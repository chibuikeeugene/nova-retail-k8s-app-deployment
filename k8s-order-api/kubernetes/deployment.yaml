apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: nova-retail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: 
                      - order-api
              topologyKey: kubernetes.io/hostname
      tolerations: # added toleration to enable scheduling to tainted nodes
        - key: workload
          operator: Equal
          value: ml
          effect: NoSchedule
      securityContext: # enhancing pod's processes with group based access 
        fsGroup: 2000
      containers:
      - name: order-api
        image: order-api:v2.0.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 1500
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        ports:
        - containerPort: 8000
        volumeMounts:
          - name: pvc-volume
            mountPath: /data
        envFrom:
        - configMapRef:
            name: order-api-config
        - secretRef:
            name: order-api-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
      volumes:
        - name: pvc-volume
          emptyDir: {} # pod only volumes. data gets lost if pod is terminated and restarted
          # persistentVolumeClaim: # alternate option for persistent data storage with pvc
          #   claimName: order-data-pvc
